name: slowed-reverbed

services:
  app:
    image: slowed-reverbed:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - '127.0.0.1:${APP_PORT:-9333}:3000'
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:3000/healthz']
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
